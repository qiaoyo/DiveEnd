name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: macOS verification
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/pdf_service/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install PDF service dependencies
        run: python -m pip install -r services/pdf_service/requirements.txt

      - name: Scan tracked files for secrets
        run: bash scripts/secret_scan.sh

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm test -- --run
          npm run build

      - name: Test and vet Go backend
        run: |
          go test ./...
          go vet ./...
          go build ./...
          go test -race ./...

      - name: Block critical production dependency advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical

      - name: Test PDF service
        run: python -m pytest -q services/pdf_service/tests

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build packaged desktop app
        run: wails build
