app:
  name: "DiveEnd"
  version: "0.1.0"
  data_dir: "~/DiveEndData"

# Sync configuration
sync:
  enabled: true
  provider: "baidu_cloud"
  local_sync_dir: "~/DiveEndData/sync"
  remote_path: "/apps/DiveEnd"
  auto_sync_on_startup: true
  auto_sync_on_change: true
  sync_debounce_seconds: 5

# UI configuration
ui:
  theme: "dark"  # dark | light | system
  font_size: 14
  sidebar_width: 280
  right_panel_width: 320

# Feature toggles
features:
  deepstart_enabled: true
  deepread_enabled: true
  screening_pipeline_enabled: true

# PDF Service configuration
pdf_service:
  host: "localhost"
  port: 50051
  auto_start: true
  python_path: "python3"
  service_script: "services/pdf_service/app/main.py"

# LLM configuration paths
llm:
  weak_config_path: "config/weak_llm.json"
  strong_config_path: "config/strong_llm.json"

# Search runtime configuration (non-secret)
search:
  enable_semantic_scholar: false
  enable_arxiv: true
  enable_openalex: true
  enable_openreview: true
  enable_dblp: true
  semantic_scholar_key_path: "config/semantic_scholar.json"
  openalex_key_path: "config/openalex.json"
  per_source_result_limit: 20
  deepstart_result_limit: 20
  retry_duration_seconds: 60
  retry_interval_seconds: 1
  request_timeout_seconds: 5
