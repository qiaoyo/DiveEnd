<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DiveEnd - 沉浸式论文阅读</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <!-- 左侧栏 - 配置 -->
    <div class="left-panel">
      <div class="panel-header">
        <h2>⚙️ DiveEnd</h2>
      </div>
      <div class="panel-content">
        <div class="section">
          <h3>LLM 配置</h3>
          <div class="form-group">
            <label>提供商</label>
            <select id="llm-provider">
              <option value="openai">OpenAI</option>
              <option value="anthropic">Anthropic Claude</option>
            </select>
          </div>
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="llm-api-key" placeholder="sk-...">
          </div>
          <div class="form-group">
            <label>Model</label>
            <input type="text" id="llm-model" placeholder="gpt-4o">
          </div>
          <div class="form-group">
            <label>Base URL (可选)</label>
            <input type="text" id="llm-base-url" placeholder="https://api.openai.com/v1/chat/completions">
          </div>
        </div>

        <div class="section">
          <h3>百度云同步</h3>
          <div class="form-group">
            <label>
              <input type="checkbox" id="baidu-enabled"> 启用同步
            </label>
          </div>
          <div class="form-group">
            <label>Access Key (AK)</label>
            <input type="password" id="baidu-ak" placeholder="AK">
          </div>
          <div class="form-group">
            <label>Secret Key (SK)</label>
            <input type="password" id="baidu-sk" placeholder="SK">
          </div>
          <button id="btn-sync-now" class="btn secondary">立即同步</button>
        </div>

        <div class="section">
          <h3>操作</div>
          <button id="btn-save-config" class="btn primary">保存配置</button>
          <div id="config-status" class="status-message"></div>
        </div>
      </div>
    </div>

    <!-- 中间主区域 -->
    <div class="center-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="deepstart">🔍 DeepStart</button>
        <button class="tab-btn" data-tab="deepread">📖 DeepRead</button>
      </div>

      <!-- DeepStart Tab -->
      <div id="deepstart-tab" class="tab-content active">
        <div class="deepstart-container">
          <div class="query-section">
            <h3>你想探索哪个研究领域？</h3>
            <textarea id="deepstart-query" placeholder="例如：我想查询和llm code agent相关的论文或者tech report工作"></textarea>
            <button id="btn-deepstart-search" class="btn primary large">开始探索 🔍</button>
          </div>

          <div id="deepstart-loading" class="loading hidden">
            <div class="spinner"></div>
            <p>正在搜索并分析论文，请稍候...</p>
          </div>

          <div id="deepstart-results" class="results-section hidden">
            <h3>检索结果</h3>
            <div id="search-results-list" class="search-results"></div>

            <div id="classification-section" class="classification-section">
              <h3>AI 分类总结</h3>
              <div id="classification-content"></div>
            </div>

            <div class="import-section">
              <h3>导入到文库</h3>
              <select id="import-folder">
                <option value="">选择目标文件夹...</option>
              </select>
              <button id="btn-create-folder" class="btn secondary">新建文件夹</button>
              <button id="btn-import-selected" class="btn primary">导入选中论文</button>
            </div>
          </div>
        </div>
      </div>

      <!-- DeepRead Tab -->
      <div id="deepread-tab" class="tab-content">
        <div class="deepread-container">
          <div id="deepread-no-selection" class="no-selection">
            <p>👈 请从右侧论文列表中选择一篇论文开始阅读</p>
          </div>
          <div id="deepread-content" class="deepread-content hidden">
            <div class="paper-info">
              <h1 id="paper-title"></h1>
              <p class="paper-authors" id="paper-authors"></p>
              <p class="paper-abstract" id="paper-abstract"></p>
              <a id="paper-url" target="_blank" class="paper-link">打开原文链接 →</a>
              <hr>
            </div>

            <div class="paper-text" id="paper-text-container">
              <!-- 用户粘贴论文内容在这里 -->
              <div class="paste-hint">
                <p>请粘贴需要翻译的论文内容到这里（按章节分段）：</p>
                <textarea id="paste-text" placeholder="在此粘贴论文原文..."></textarea>
                <div class="paste-actions">
                  <input id="section-name" placeholder="章节名称（如：Introduction）">
                  <button id="btn-deepread-translate" class="btn primary">一键AI翻译 ✨</button>
                </div>
              </div>

              <div id="translated-sections" class="translated-sections">
                <!-- Translated sections go here -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧栏 - 论文列表 -->
    <div class="right-panel">
      <div class="panel-header">
        <h2>📚 我的文库</h2>
        <select id="folder-select">
          <option value="">全部</option>
        </select>
      </div>
      <div id="paper-list" class="paper-list">
        <!-- Papers loaded here -->
      </div>
    </div>

    <!-- 翻译侧边栏 -->
    <div id="translation-sidebar" class="translation-sidebar">
      <div class="sidebar-header">
        <h3>💡 AI 翻译</h3>
      </div>
      <div id="translation-content" class="translation-content">
        <!-- Translation shows here when hovering/selecting -->
        <p class="empty-hint">选择左侧原文段落查看翻译...</p>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
