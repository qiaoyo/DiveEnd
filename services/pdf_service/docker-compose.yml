# DiveEnd PDF Processing Service - Docker Compose
#
# Usage:
#   docker-compose up -d          # Start services
#   docker-compose down           # Stop services
#   docker-compose logs -f        # View logs
#   docker-compose build          # Rebuild images

version: '3.8'

services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: diveend-pdf-service
    restart: unless-stopped
    ports:
      # Bind the host side to loopback only. The container still listens on
      # 0.0.0.0 internally so Docker port forwarding can reach the service.
      - "127.0.0.1:50051:50051"
    environment:
      # LLM API Keys (required)
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # PDF Service Configuration
      # Keep 0.0.0.0 inside Docker; do not publish it beyond localhost above.
      - PDF_HOST=0.0.0.0
      - PDF_PORT=50051
      - PDF_WORKERS=1

      # Logging
      - LOG_LEVEL=info

    volumes:
      # Mount for temporary PDF storage
      - pdf-temp:/tmp/pdf-service

      # Mount for logs (optional)
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:50051/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Redis for caching (can be enabled if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: diveend-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   command: redis-server --appendonly yes

volumes:
  pdf-temp:
    driver: local
  # redis-data:
  #   driver: local

networks:
  default:
    name: diveend-network
